apiVersion: apps/v1
kind: Deployment
metadata:
  name: teendo-app
  namespace: teendo
  labels:
    app: teendo-app
spec:
  # Az adatok memóriában vannak, ezért 1 replikát futtatunk (lásd dokumentáció: korlátok)
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: teendo-app
  template:
    metadata:
      labels:
        app: teendo-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: teendo-app
          # A pipeline a commit SHA-val taggelt image-re cseréli
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
