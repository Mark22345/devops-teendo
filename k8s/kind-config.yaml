# Kind (Kubernetes in Docker) sandbox cluster konfiguráció.
# A 30080-as NodePortot kivezetjük a gazdagép 8080-as portjára,
# így a pipeline a http://localhost:8080 címen éri el az alkalmazást.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
